# Keeps the public website up to date, for free, on GitHub's servers:
# - every 6 hours: midnight, 6 am, noon and 6 pm Tennessee (US Central) time;
# - as soon as the community feed publishes a new tournament snapshot. The timers below look for
#   one, and because GitHub often runs them hours late, the owner's PC can also start this workflow
#   (jwa_tracker/website_trigger.py).
# 1. Downloads any new leaderboard snapshots from the feed.
# 2. Saves them in archive/ (committed back to this repository, so history is never lost).
# 3. Builds the website and publishes it on GitHub Pages.
name: Update website

on:
  schedule:
    # Only checks: the "when" job decides in seconds whether anything needs doing. GitHub often
    # starts timers late or skips them, worst at the top of the hour, so these are frequent and
    # at quieter minutes. Times are UTC; tournaments run Friday 15:00 to Monday 15:00 UTC.
    - cron: "7,22,37,52 * * * 0,1,5,6"   # Friday to Monday: every 15 minutes
    - cron: "7,37 * * * 2,3,4"           # Tuesday to Thursday: every 30 minutes
  workflow_dispatch: {}            # adds a "Run workflow" button for an update right now
  push:                            # republish when you upload changes (the bot's own data saves do not trigger this)
    branches: [main]
    paths-ignore: ["archive/**"]

permissions:
  contents: write   # to save archive/ back to the repository
  pages: write
  id-token: write

concurrency:
  group: update-website
  cancel-in-progress: false

jobs:
  when:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # the latest copy: a run that waited for another one must see what that one saved

      - id: check
        name: Is a 6-hour update due, or is there a new tournament snapshot?
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "schedule" ]; then
            python3 tracker.py website-due --archive archive
          else
            echo "run=yes" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: when
    if: needs.when.outputs.run == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # the latest copy: a run that waited for another one must see what that one saved

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect new data and build the website
        run: python tracker.py build-site --out _site --archive archive

      - name: Save the snapshot history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archive web/img/silhouettes
          if git diff --cached --quiet; then
            echo "Nothing new to save."
          else
            git commit -m "Data update $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin main   # in case changes were uploaded during this build
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
